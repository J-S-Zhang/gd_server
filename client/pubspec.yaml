name: guandan_client
description: 六人掼蛋移动端游戏客户端
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.2
  go_router: ^13.0.0
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  package_info_plus: ^8.0.0
  ota_update: ^7.1.0
  permission_handler: ^11.3.1
  flutter_webrtc: ^0.12.12
  image_picker: ^1.1.2
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/ui_config.json
    - assets/images/
    - assets/images/avatars/
    - assets/images/bgs/
    - assets/images/cards/
    - assets/images/ui/
    - assets/sounds/
    - assets/sounds/bgm/
    - assets/sounds/effects/
    - assets/sounds/voices/female/alert/
    - assets/sounds/voices/female/beat/
    - assets/sounds/voices/female/bid/
    - assets/sounds/voices/female/misc/
    - assets/sounds/voices/female/msgs/
    - assets/sounds/voices/female/pair/
    - assets/sounds/voices/female/pass/
    - assets/sounds/voices/female/single/
    - assets/sounds/voices/female/trio/
    - assets/sounds/voices/female/type/
    - assets/sounds/voices/male/alert/
    - assets/sounds/voices/male/beat/
    - assets/sounds/voices/male/bid/
    - assets/sounds/voices/male/msgs/
    - assets/sounds/voices/male/pair/
    - assets/sounds/voices/male/pass/
    - assets/sounds/voices/male/single/
    - assets/sounds/voices/male/trio/
    - assets/sounds/voices/male/type/
