# WebSocket：对外 443（TCP）→ 游戏服务 9001
# 需在 nginx.conf 的 stream { } 块内 include，见 NGINX_SETUP.md
#
# 客户端连接：ws://<SERVER_HOST>:443
# 注意：此为 TCP 转发，非 TLS 终止；适用于手机网络放行 443 端口的场景。

upstream guandan_ws_backend {
    server 127.0.0.1:9001;
}

server {
    listen 443;
    listen [::]:443;
    proxy_pass guandan_ws_backend;
    proxy_connect_timeout 10s;
    proxy_timeout 300s;
}
