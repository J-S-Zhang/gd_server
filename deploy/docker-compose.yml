version: '3.8'

services:
  game-server:
    build:
      context: ../server
      dockerfile: ../deploy/docker/Dockerfile
    ports:
      - "9001:9001"
    volumes:
      - ../server/logs:/app/logs
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guandan
      POSTGRES_USER: guandan
      POSTGRES_PASSWORD: guandan_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/guandan.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - game-server
    restart: unless-stopped

volumes:
  pgdata:
