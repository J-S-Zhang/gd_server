version: '3.8'

services:
  game-server:
    build:
      context: ../server
      dockerfile: ../deploy/docker/Dockerfile
    ports:
      - "9001:9001"
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://guandan:guandan_pass@postgres:5432/guandan
    volumes:
      - ../server/logs:/app/logs
      - ../downloads:/app/downloads
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guandan
      POSTGRES_USER: guandan
      POSTGRES_PASSWORD: guandan_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/guandan.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - game-server
    restart: unless-stopped

  # 文档 WebRTC 方案 SFU（VOICE_BACKEND=webrtc 时使用，端口 4444）
  webrtc-sfu:
    build:
      context: ../server/webrtc-sfu
      dockerfile: Dockerfile
    ports:
      - "4444:4444"
    environment:
      SFU_PORT: "4444"
    restart: unless-stopped

  # LiveKit SFU（开发模式：api_key=devkey, api_secret=secret，与 server/config/livekit.json.example 一致）
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50100:50000-50100/udp"
    restart: unless-stopped

volumes:
  pgdata:
